<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IsoGate · 隔离式 AI API 网关控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231677ff'/%3E%3Cpath d='M16 6l8 3.5v6.2c0 5-3.3 9-8 10.3-4.7-1.3-8-5.3-8-10.3V9.5L16 6z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./theme.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>

  <div id="mobile-backdrop" class="modal-mask hidden lg:hidden"></div>

  <div class="app-shell">
    <!-- 侧栏：208px，可收起至 48px（规范第 9 章公共框架） -->
    <aside id="sidebar" class="app-sidebar -translate-x-full">
      <div class="sidebar-brand">
        <div class="flex items-center gap-2">
          <span class="brand-mark"><i data-lucide="shield-check" class="w-4 h-4"></i></span>
          <span class="brand-name shiny-text">IsoGate</span>
        </div>
        <button id="close-sidebar-btn" class="btn btn-text btn-icon lg:hidden" aria-label="收起导航">
          <i data-lucide="menu" class="w-4 h-4"></i>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="主导航">
        <div class="nav-group-title">租户工作台</div>
        <button data-nav="overview" class="nav-item active" aria-current="page">
          <i data-lucide="layout-dashboard"></i><span>总览看板</span>
        </button>
        <button data-nav="proxies" class="nav-item">
          <i data-lucide="globe-lock"></i><span>专属静态 IP</span>
          <span id="badge-proxies" class="nav-badge">0</span>
        </button>
        <button data-nav="accounts" class="nav-item">
          <i data-lucide="cpu"></i><span>上游账号绑定</span>
          <span id="badge-accounts" class="nav-badge">3</span>
        </button>
        <button data-nav="keys" class="nav-item">
          <i data-lucide="key-round"></i><span>网关 API Key</span>
          <span id="badge-keys" class="nav-badge">2</span>
        </button>
        <button data-nav="logs" class="nav-item">
          <i data-lucide="file-search"></i><span>官方转发审计日志</span>
        </button>
        <button data-nav="admin" id="admin-nav" class="nav-item hidden">
          <i data-lucide="shield"></i><span>管理后台</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-status">
          <div class="flex items-center gap-2">
            <span class="status-dot success"></span>Fail-Closed 隔离生效中
          </div>
          <p>仅通过系统为您自动分配的专属静态 IP 出站；付款后自动开通，一账号一 IP，异常时直接阻断。</p>
        </div>
        <div id="user-card" class="user-card">
          <span class="user-avatar">AX</span>
          <div class="min-w-0 flex-1">
            <div class="truncate font-medium">alex@studio.dev</div>
            <div class="text-xs truncate mono" style="color: var(--color-text-tertiary)">Tenant · 并发上限 5</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="flex items-center gap-3 min-w-0">
          <button id="open-sidebar-btn" class="btn btn-text btn-icon lg:hidden" aria-label="展开导航">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 id="page-title" class="topbar-title truncate">总览看板</h1>
              <span class="tag tag-info hidden md:inline">TLS 1.3 · E2E Isolated</span>
            </div>
            <p id="page-subtitle" class="topbar-desc truncate hidden sm:block">单租户链路健康、Prompt Cache 命中率与官方转发审计日志实时监控</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="refresh-btn" class="btn">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            <span class="hidden sm:inline">刷新数据</span>
          </button>
          <button id="quick-create-key-btn" class="moving-border-btn" aria-label="签发 API Key">
            <span class="moving-border-btn-inner">
              <i data-lucide="plus" class="w-4 h-4"></i><span>签发 API Key</span>
            </span>
          </button>
        </div>
      </header>

      <main id="main-content" class="page">
        <!-- 由 app.js 动态渲染 -->
      </main>
    </div>
  </div>

  <div id="modal-root" class="modal-mask hidden">
    <div id="modal-card" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h3 id="modal-title" class="card-title"></h3>
        <button id="modal-close-btn" class="btn btn-text btn-icon" aria-label="关闭弹窗">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-foot"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-wrap"></div>

  <script src="app.js"></script>
</body>
</html>
