<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IsoGate · 隔离式 AI API 网关控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-obsidian: #05060a;
      --surface-card: rgba(13, 16, 25, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background-color: var(--bg-obsidian);
      color: #f1f5f9;
    }

    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* Aceternity Dotted Glow + Aurora Background */
    .bg-dot-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .aurora-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .aurora-orb-1 {
      position: absolute;
      top: -180px;
      left: 18%;
      width: 620px;
      height: 420px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(56, 189, 248, 0.08) 45%, transparent 72%);
      filter: blur(48px);
      animation: aurora-drift 14s ease-in-out infinite alternate;
    }

    .aurora-orb-2 {
      position: absolute;
      bottom: -160px;
      right: 6%;
      width: 560px;
      height: 380px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.16) 0%, rgba(139, 92, 246, 0.09) 48%, transparent 72%);
      filter: blur(56px);
      animation: aurora-drift 18s ease-in-out infinite alternate-reverse;
    }

    @keyframes aurora-drift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(32px, 18px, 0) scale(1.08); }
    }

    /* Aceternity Spotlight & Glass Bento Card */
    .spotlight-card {
      position: relative;
      background: linear-gradient(180deg, rgba(18, 22, 34, 0.84) 0%, rgba(11, 14, 22, 0.88) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 12px 32px -16px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(14px);
      transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
    }

    .spotlight-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 0%),
        rgba(99, 102, 241, 0.14),
        rgba(34, 211, 238, 0.05) 35%,
        transparent 68%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 0;
    }

    .spotlight-card:hover {
      border-color: rgba(129, 140, 248, 0.32);
    }

    .spotlight-card:hover::before {
      opacity: 1;
    }

    .spotlight-card > * {
      position: relative;
      z-index: 1;
    }

    /* Aceternity Moving Border Glow Button */
    .moving-border-btn {
      position: relative;
      padding: 1.5px;
      border-radius: 10px;
      background: conic-gradient(from var(--angle, 0deg), #6366f1, #22d3ee, #10b981, #8b5cf6, #6366f1);
      animation: rotate-glow 3.6s linear infinite;
      box-shadow: 0 0 22px -6px rgba(99, 102, 241, 0.55);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .moving-border-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 28px -4px rgba(34, 211, 238, 0.55);
    }

    .moving-border-btn-inner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8.5px;
      background: linear-gradient(180deg, #131728 0%, #0b0e18 100%);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes rotate-glow {
      to { --angle: 360deg; }
    }

    /* React Bits Shiny Gradient Text */
    .shiny-text {
      background: linear-gradient(110deg, #e2e8f0 20%, #818cf8 45%, #67e8f9 55%, #e2e8f0 80%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine-sweep 5s linear infinite;
    }

    @keyframes shine-sweep {
      to { background-position: 220% center; }
    }

    /* Sidebar Nav with Lamp Indicator */
    .nav-item {
      position: relative;
      color: #94a3b8;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-item.active {
      color: #ffffff;
      font-weight: 600;
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.18) 0%, rgba(34, 211, 238, 0.05) 100%);
      border: 1px solid rgba(129, 140, 248, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 22%;
      bottom: 22%;
      width: 3px;
      border-radius: 999px;
      background: linear-gradient(180deg, #818cf8, #22d3ee);
      box-shadow: 0 0 12px #22d3ee;
    }

    .nav-item.active i { color: #67e8f9; }

    /* Uiverse Cyber Toggle Switch */
    .cyber-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 40px;
      height: 22px;
      cursor: pointer;
    }

    .cyber-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .cyber-slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cyber-slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 2px;
      top: 2px;
      border-radius: 999px;
      background: #94a3b8;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .cyber-switch input:checked + .cyber-slider {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.32), rgba(34, 211, 238, 0.28));
      border-color: rgba(52, 211, 153, 0.65);
      box-shadow: 0 0 14px -2px rgba(16, 185, 129, 0.55);
    }

    .cyber-switch input:checked + .cyber-slider::before {
      transform: translateX(18px);
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
    }

    /* Animated Data Flow Beam */
    @keyframes beam-flow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    .beam-line {
      stroke-dasharray: 4 4;
      animation: beam-flow 1.2s linear infinite;
    }

    /* Pulsing Beacon */
    @keyframes beacon-ring {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .beacon-dot {
      position: relative;
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }
    .beacon-dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: inherit;
      animation: beacon-ring 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.22); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.42); }
  </style>
</head>
<body class="bg-dot-grid min-h-screen antialiased overflow-x-hidden selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Ambient Aurora Glow -->
  <div class="aurora-layer" aria-hidden="true">
    <div class="aurora-orb-1"></div>
    <div class="aurora-orb-2"></div>
  </div>

  <!-- Mobile Sidebar Backdrop -->
  <div id="mobile-backdrop" class="fixed inset-0 bg-black/70 z-40 hidden lg:hidden backdrop-blur-sm"></div>

  <div class="relative z-10 min-h-screen flex">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-[#090b12]/90 backdrop-blur-xl border-r border-white/[0.07] flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out">
      <!-- Brand -->
      <div class="h-16 px-5 flex items-center justify-between border-b border-white/[0.06]">
        <div class="flex items-center gap-3">
          <div class="relative w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 via-violet-500 to-cyan-400 p-[1px] shadow-lg shadow-indigo-500/25">
            <div class="w-full h-full rounded-[7px] bg-[#0b0e18] flex items-center justify-center text-cyan-300">
              <i data-lucide="shield-check" class="w-4 h-4"></i>
            </div>
          </div>
          <div>
            <div class="font-bold text-sm tracking-tight leading-none shiny-text">IsoGate</div>
            <div class="text-[11px] text-slate-400 mt-1 mono">AUTO-IP · ZERO DRIFT</div>
          </div>
        </div>
        <button id="close-sidebar-btn" class="lg:hidden p-1.5 rounded-md text-slate-400 hover:text-white hover:bg-white/10" aria-label="关闭菜单">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <div class="px-3 mb-2 text-[10px] font-semibold uppercase tracking-[0.14em] text-slate-500">租户工作台</div>
        <button data-nav="overview" class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] border border-transparent">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>总览看板</span>
        </button>
        <button data-nav="proxies" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] border border-transparent">
          <i data-lucide="globe-lock" class="w-4 h-4"></i>
          <span>专属静态 IP</span>
          <span id="badge-proxies" class="ml-auto text-[11px] mono px-1.5 py-0.5 rounded-md bg-white/[0.06] text-slate-300">0</span>
        </button>
        <button data-nav="accounts" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] border border-transparent">
          <i data-lucide="cpu" class="w-4 h-4"></i>
          <span>上游账号绑定</span>
          <span id="badge-accounts" class="ml-auto text-[11px] mono px-1.5 py-0.5 rounded-md bg-white/[0.06] text-slate-300">3</span>
        </button>
        <button data-nav="keys" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] border border-transparent">
          <i data-lucide="key-round" class="w-4 h-4"></i>
          <span>网关 API Key</span>
          <span id="badge-keys" class="ml-auto text-[11px] mono px-1.5 py-0.5 rounded-md bg-white/[0.06] text-slate-300">2</span>
        </button>
        <button data-nav="logs" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] border border-transparent">
          <i data-lucide="file-search" class="w-4 h-4"></i>
          <span>官方转发审计日志</span>
        </button>
        <button data-nav="admin" id="admin-nav" class="nav-item hidden w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] border border-transparent">
          <i data-lucide="shield" class="w-4 h-4"></i>
          <span>管理后台</span>
        </button>
      </nav>

      <!-- Security Status Footer -->
      <div class="p-3 border-t border-white/[0.06] space-y-3">
        <div class="rounded-xl bg-gradient-to-br from-emerald-500/10 via-cyan-500/5 to-transparent border border-emerald-500/25 p-3">
          <div class="flex items-center gap-2 text-xs font-semibold text-emerald-300">
            <span class="beacon-dot bg-emerald-400"></span>
            Fail-Closed 隔离生效中
          </div>
          <p class="text-[11px] text-slate-400 mt-1.5 leading-relaxed">
            仅通过系统为您自动分配的专属静态 IP 出站；付款后自动开通，一用户一 IP，异常时直接阻断。
          </p>
        </div>
        <div id="user-card" class="flex items-center gap-2.5 px-2 py-1.5 rounded-lg bg-white/[0.03] border border-white/[0.05]">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-cyan-500 text-white text-xs font-bold flex items-center justify-center shrink-0 shadow-md shadow-indigo-500/20">
            AX
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-slate-100 truncate">alex@studio.dev</div>
            <div class="text-[11px] text-slate-400 truncate mono">Tenant · 并发上限 5</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 lg:pl-64 flex flex-col min-w-0">
      <!-- Top Glass Header -->
      <header class="sticky top-0 z-30 h-16 bg-[#070910]/80 backdrop-blur-xl border-b border-white/[0.07] px-4 sm:px-6 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button id="open-sidebar-btn" class="lg:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10" aria-label="打开菜单">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="min-w-0">
            <div class="flex items-center gap-2.5">
              <h1 id="page-title" class="text-base sm:text-lg font-semibold text-white tracking-tight truncate">总览看板</h1>
              <span class="hidden md:inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium mono bg-white/[0.05] text-cyan-300 border border-cyan-500/25">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>TLS 1.3 · E2E Isolated
              </span>
            </div>
            <p id="page-subtitle" class="text-xs text-slate-400 hidden sm:block truncate mt-0.5">单租户链路健康、Prompt Cache 命中率与官方转发审计日志实时监控</p>
          </div>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <button id="refresh-btn" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium bg-white/[0.04] border border-white/[0.1] text-slate-200 hover:bg-white/[0.09] hover:border-white/[0.18] transition-all">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-cyan-400"></i>
            <span class="hidden sm:inline">刷新数据</span>
            <span class="sm:hidden">刷新</span>
          </button>
          <button id="quick-create-key-btn" class="moving-border-btn" aria-label="签发 API Key">
            <span class="moving-border-btn-inner">
              <i data-lucide="plus" class="w-3.5 h-3.5 text-cyan-300"></i>
              <span>签发 API Key</span>
            </span>
          </button>
        </div>
      </header>

      <!-- Page Container -->
      <main id="main-content" class="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto space-y-6">
        <!-- Rendered dynamically by JS -->
      </main>
    </div>
  </div>

  <!-- Dark Glass Modal Container -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-md">
    <div id="modal-card" class="bg-[#0d111d] rounded-2xl shadow-2xl border border-white/[0.1] w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden" style="box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 25px 60px -15px rgba(0,0,0,0.85);">
      <div class="px-5 py-4 border-b border-white/[0.07] flex items-center justify-between">
        <h3 id="modal-title" class="text-sm font-semibold text-white"></h3>
        <button id="modal-close-btn" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10" aria-label="关闭弹窗">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto space-y-4"></div>
      <div id="modal-footer" class="px-5 py-3.5 bg-white/[0.02] border-t border-white/[0.07] flex items-center justify-end gap-2.5"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-[calc(100%-2.5rem)] pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
