# 全栈一键部署：PostgreSQL 16 + Redis 7 + Gateway + Nginx
# 用法: cd isolated-ai-gateway && docker compose -f deploy/docker-compose.full.yml --env-file deploy/.env.example up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-iso}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-isopass}
      POSTGRES_DB: ${PG_DB:-isogw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-iso}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://${PG_USER:-iso}:${PG_PASSWORD:-isopass}@postgres:5432/${PG_DB:-isogw}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      REQUIRE_PROXY_DEFAULT: ${REQUIRE_PROXY_DEFAULT:-true}
      DEBUG: "false"
    volumes:
      - ../frontend:/app/frontend:ro
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/var/www/console:ro

volumes:
  pgdata:
  redisdata:
